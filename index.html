<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Training: The Career Action Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
        }

        .step-active { color: #1e3a8a; border-bottom: 4px solid #1e3a8a; }
        .step-inactive { color: #94a3b8; border-bottom: 4px solid #e2e8f0; }

        /* Animation for content switching */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Interactive Card Flip */
        .pillar-card {
            perspective: 1000px;
            cursor: pointer;
            height: 300px;
        }
        .pillar-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .pillar-card.flipped .pillar-inner {
            transform: rotateY(180deg);
        }
        .pillar-front, .pillar-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .pillar-back {
            transform: rotateY(180deg);
            background-color: #1e3a8a;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap text-amber-400 text-xl"></i>
                <span class="font-bold tracking-tight">BUSI 1200: Week 1 Micro-Lesson</span>
            </div>
            <div id="progress-text" class="text-xs font-semibold uppercase tracking-widest text-blue-300">Section 1 of 6</div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="w-full bg-gray-200 h-1.5">
        <div id="progress-bar" class="bg-amber-500 h-1.5 transition-all duration-500" style="width: 16.6%"></div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div id="content-mount" class="max-w-4xl w-full">
            <!-- Content will be injected here by JS -->
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="bg-white border-t border-gray-200 p-6">
        <div class="max-w-4xl mx-auto flex justify-between">
            <button id="prev-btn" onclick="prevStep()" class="px-6 py-2 rounded-lg font-bold text-gray-400 hover:text-blue-900 transition-colors hidden">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back
            </button>
            <div class="flex-grow"></div>
            <button id="next-btn" onclick="nextStep()" class="bg-blue-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-800 shadow-lg shadow-blue-200 transition-all flex items-center">
                <span>Start Learning</span> <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </footer>

    <script>
        let currentStep = 0;
        const steps = [
            {
                title: "Welcome to Career Action Planning",
                type: "intro",
                content: `
                    <div class="text-center fade-in">
                        <h1 class="text-4xl font-black text-blue-900 mb-6">Building Your Roadmap</h1>
                        <p class="text-xl text-gray-600 mb-8">A Career Action Plan (CAP) isn't just a document—it's a living strategy. To succeed in this class and beyond, you must master the 4 core components.</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="p-4 bg-white rounded-xl shadow-sm border-t-4 border-blue-900">
                                <i class="fa-solid fa-user-check text-2xl text-blue-900 mb-2"></i>
                                <p class="text-xs font-bold uppercase">Self-Assessment</p>
                            </div>
                            <div class="p-4 bg-white rounded-xl shadow-sm border-t-4 border-amber-500">
                                <i class="fa-solid fa-bullseye text-2xl text-amber-500 mb-2"></i>
                                <p class="text-xs font-bold uppercase">Goal Setting</p>
                            </div>
                            <div class="p-4 bg-white rounded-xl shadow-sm border-t-4 border-teal-500">
                                <i class="fa-solid fa-magnifying-glass text-2xl text-teal-500 mb-2"></i>
                                <p class="text-xs font-bold uppercase">Career Research</p>
                            </div>
                            <div class="p-4 bg-white rounded-xl shadow-sm border-t-4 border-purple-500">
                                <i class="fa-solid fa-comments text-2xl text-purple-500 mb-2"></i>
                                <p class="text-xs font-bold uppercase">Networking</p>
                            </div>
                        </div>
                    </div>
                `,
                nextLabel: "Explore the Pillars"
            },
            {
                title: "The 4 Pillars",
                type: "interactive",
                content: `
                    <div class="fade-in">
                        <h2 class="text-2xl font-bold text-center mb-4">Click each card to reveal the core mission</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="pillar-card" onclick="this.classList.toggle('flipped')">
                                <div class="pillar-inner">
                                    <div class="pillar-front bg-white shadow-md border border-gray-100">
                                        <i class="fa-solid fa-user-check text-4xl text-blue-900 mb-4"></i>
                                        <h3 class="text-xl font-bold text-blue-900">1. Self-Assessment</h3>
                                        <p class="text-sm text-gray-400 mt-2">Click to flip</p>
                                    </div>
                                    <div class="pillar-back">
                                        <h3 class="font-bold mb-2">Knowing Yourself</h3>
                                        <p class="text-sm">Identifying your values, skills, and personality traits. You can't plan a destination if you don't know who is driving the car.</p>
                                    </div>
                                </div>
                            </div>
                            <div class="pillar-card" onclick="this.classList.toggle('flipped')">
                                <div class="pillar-inner">
                                    <div class="pillar-front bg-white shadow-md border border-gray-100">
                                        <i class="fa-solid fa-bullseye text-4xl text-amber-500 mb-4"></i>
                                        <h3 class="text-xl font-bold text-blue-900">2. Goal Setting</h3>
                                        <p class="text-sm text-gray-400 mt-2">Click to flip</p>
                                    </div>
                                    <div class="pillar-back" style="background-color: #d97706">
                                        <h3 class="font-bold mb-2">Defining the Target</h3>
                                        <p class="text-sm">Creating SMART (Specific, Measurable, Achievable, Relevant, Time-bound) goals. This is your homework for this week!</p>
                                    </div>
                                </div>
                            </div>
                            <div class="pillar-card" onclick="this.classList.toggle('flipped')">
                                <div class="pillar-inner">
                                    <div class="pillar-front bg-white shadow-md border border-gray-100">
                                        <i class="fa-solid fa-magnifying-glass text-4xl text-teal-500 mb-4"></i>
                                        <h3 class="text-xl font-bold text-blue-900">3. Career Research</h3>
                                        <p class="text-sm text-gray-400 mt-2">Click to flip</p>
                                    </div>
                                    <div class="pillar-back" style="background-color: #0d9488">
                                        <h3 class="font-bold mb-2">Market Intelligence</h3>
                                        <p class="text-sm">Exploring industries, job roles, and salary data. In Week 7, we will dive deep into Handshake for this step.</p>
                                    </div>
                                </div>
                            </div>
                            <div class="pillar-card" onclick="this.classList.toggle('flipped')">
                                <div class="pillar-inner">
                                    <div class="pillar-front bg-white shadow-md border border-gray-100">
                                        <i class="fa-solid fa-comments text-4xl text-purple-600 mb-4"></i>
                                        <h3 class="text-xl font-bold text-blue-900">4. Networking</h3>
                                        <p class="text-sm text-gray-400 mt-2">Click to flip</p>
                                    </div>
                                    <div class="pillar-back" style="background-color: #7c3aed">
                                        <h3 class="font-bold mb-2">Building Connections</h3>
                                        <p class="text-sm">Connecting with alumni and pros. Remember: 70-85% of jobs are filled through networking, not just applications.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                nextLabel: "Why Self-Assessment?"
            },
            {
                title: "Deep Dive: Step 1",
                type: "text",
                content: `
                    <div class="fade-in space-y-6">
                        <div class="bg-blue-900 text-white p-6 rounded-2xl shadow-xl">
                            <h2 class="text-3xl font-black mb-2">1. Self-Assessment</h2>
                            <p class="text-blue-200 italic">The "Internal Inventory"</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="p-4 bg-white border border-gray-200 rounded-xl">
                                <h4 class="font-bold text-blue-900 mb-2">Interests</h4>
                                <p class="text-sm text-gray-600">What tasks make you lose track of time?</p>
                            </div>
                            <div class="p-4 bg-white border border-gray-200 rounded-xl">
                                <h4 class="font-bold text-blue-900 mb-2">Skills</h4>
                                <p class="text-sm text-gray-600">What can you contribute to an organization today?</p>
                            </div>
                            <div class="p-4 bg-white border border-gray-200 rounded-xl">
                                <h4 class="font-bold text-blue-900 mb-2">Values</h4>
                                <p class="text-sm text-gray-600">Is work-life balance or high income more important?</p>
                            </div>
                        </div>
                        <div class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl">
                            <p class="text-sm text-amber-800"><strong>Pro Tip:</strong> Most students skip this step and go straight to applying. By starting here, your "Identity Toolkit" will be 10x more authentic.</p>
                        </div>
                    </div>
                `,
                nextLabel: "Mastering Goals"
            },
            {
                title: "Deep Dive: Step 2",
                type: "text",
                content: `
                    <div class="fade-in space-y-6">
                        <div class="bg-amber-500 text-white p-6 rounded-2xl shadow-xl">
                            <h2 class="text-3xl font-black mb-2">2. Goal Setting</h2>
                            <p class="text-amber-100 italic">Turning Vision into Action</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                            <h3 class="font-bold text-blue-900 mb-4">The SMART Framework</h3>
                            <ul class="space-y-3">
                                <li class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-bold">S</span> <span><strong>Specific:</strong> What exactly do you want to achieve?</span></li>
                                <li class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-bold">M</span> <span><strong>Measurable:</strong> How will you track progress?</span></li>
                                <li class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-bold">A</span> <span><strong>Action-Oriented:</strong> What are the verb-based steps?</span></li>
                                <li class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-bold">R</span> <span><strong>Realistic:</strong> Is this possible within your schedule?</span></li>
                                <li class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-bold">T</span> <span><strong>Time-bound:</strong> When is your deadline?</span></li>
                            </ul>
                        </div>
                    </div>
                `,
                nextLabel: "Check Your Knowledge"
            },
            {
                title: "Quiz",
                type: "quiz",
                content: `
                    <div class="fade-in space-y-6">
                        <div class="text-center">
                            <h2 class="text-2xl font-bold text-blue-900">Knowledge Check</h2>
                            <p class="text-gray-500">What is the most common reason for skipping Self-Assessment?</p>
                        </div>
                        <div class="space-y-3">
                            <button onclick="handleQuiz(this, false)" class="w-full p-4 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 transition-all flex justify-between items-center">
                                <span>It takes too much technical skill.</span>
                                <i class="fa-solid fa-circle-notch text-gray-200"></i>
                            </button>
                            <button onclick="handleQuiz(this, true)" class="w-full p-4 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 transition-all flex justify-between items-center">
                                <span>People rush to get a job before knowing their "Why".</span>
                                <i class="fa-solid fa-circle-notch text-gray-200"></i>
                            </button>
                            <button onclick="handleQuiz(this, false)" class="w-full p-4 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 transition-all flex justify-between items-center">
                                <span>It's not actually important for business majors.</span>
                                <i class="fa-solid fa-circle-notch text-gray-200"></i>
                            </button>
                        </div>
                        <div id="quiz-feedback" class="hidden p-4 rounded-xl text-center font-bold"></div>
                    </div>
                `,
                nextLabel: "Homework Briefing"
            },
            {
                title: "Next Steps",
                type: "outro",
                content: `
                    <div class="text-center fade-in">
                        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fa-solid fa-check text-4xl"></i>
                        </div>
                        <h2 class="text-3xl font-black text-blue-900 mb-4">Training Complete!</h2>
                        <p class="text-lg text-gray-600 mb-8">You are now ready to tackle your first major assignment.</p>
                        
                        <div class="bg-amber-50 p-6 rounded-2xl border-2 border-amber-200 inline-block text-left max-w-md">
                            <h4 class="font-bold text-amber-900 mb-2 underline">Your Assignment:</h4>
                            <ul class="space-y-2 text-amber-800 text-sm">
                                <li><i class="fa-solid fa-pen-to-square mr-2"></i> 1 Personal Mission Statement</li>
                                <li><i class="fa-solid fa-list-check mr-2"></i> 3 Career Action Plan Goals</li>
                                <li><i class="fa-solid fa-cloud-arrow-up mr-2"></i> Submit to Canvas before next class</li>
                            </ul>
                        </div>
                    </div>
                `,
                nextLabel: "Finish & Close"
            }
        ];

        function renderStep() {
            const step = steps[currentStep];
            const mount = document.getElementById('content-mount');
            mount.innerHTML = step.content;
            
            // Update UI State
            document.getElementById('progress-text').innerText = `Section ${currentStep + 1} of ${steps.length}`;
            document.getElementById('progress-bar').style.width = `${((currentStep + 1) / steps.length) * 100}%`;
            document.getElementById('next-btn').querySelector('span').innerText = step.nextLabel;
            
            // Handle Button Visibility
            document.getElementById('prev-btn').classList.toggle('hidden', currentStep === 0);
            
            if (currentStep === steps.length - 1) {
                document.getElementById('next-btn').classList.add('bg-green-600', 'hover:bg-green-700');
                
                // UPDATED: Redirect to Canvas Assignment on Finish
                document.getElementById('next-btn').onclick = () => {
                    window.parent.location.href = "https://unt.instructure.com/courses/140665/assignments/2967528?module_item_id=9147229";
                };
            } else {
                document.getElementById('next-btn').classList.remove('bg-green-600', 'hover:bg-green-700');
                document.getElementById('next-btn').onclick = nextStep;
            }
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function handleQuiz(el, isCorrect) {
            const feedback = document.getElementById('quiz-feedback');
            const buttons = el.parentElement.querySelectorAll('button');
            
            buttons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                el.classList.add('bg-green-100', 'border-green-500');
                el.querySelector('i').className = 'fa-solid fa-circle-check text-green-500';
                feedback.innerText = "Correct! Self-assessment is the foundation most people skip in their rush to find 'any' job.";
                feedback.className = "p-4 rounded-xl text-center font-bold bg-green-50 text-green-700 block fade-in";
            } else {
                el.classList.add('bg-red-100', 'border-red-500');
                el.querySelector('i').className = 'fa-solid fa-circle-xmark text-red-500';
                feedback.innerText = "Not quite. Remember, step 1 is about the internal 'Why' before external 'What'.";
                feedback.className = "p-4 rounded-xl text-center font-bold bg-red-50 text-red-700 block fade-in";
            }
        }

        // Initialize
        renderStep();
    </script>
</body>
</html>
